# Builds and tests the app on GitHub-hosted runners, so no local Mac is needed.
# - core-tests: ScanCore package tests on Linux (fast, cheap)
# - ios: XcodeGen project, unit tests on the iOS Simulator, and an unsigned
#        .ipa artifact that can be signed and installed (see Docs/INSTALL_WITHOUT_MAC.md)
name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: ScanCore tests
        working-directory: Packages/ScanCore
        run: swift test

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          print(c[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: |
          status=0
          xcodebuild test \
            -project LiDARScanner.xcodeproj \
            -scheme LiDARScanner \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:LiDARScannerTests \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild-test.log 2>&1 || status=$?
          grep -E "error:|Test Case.*failed|Executed|\*\* " xcodebuild-test.log | head -300 || true
          exit $status

      - name: Build unsigned device app (.ipa)
        run: |
          status=0
          xcodebuild archive \
            -project LiDARScanner.xcodeproj \
            -scheme LiDARScanner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/LiDARScanner.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > xcodebuild-archive.log 2>&1 || status=$?
          grep -E "error:|\*\* " xcodebuild-archive.log | head -300 || true
          if [ $status -ne 0 ]; then exit $status; fi
          mkdir -p build/Payload
          cp -R build/LiDARScanner.xcarchive/Products/Applications/LiDARScanner.app build/Payload/
          (cd build && zip -qry LiDARScanner-unsigned.ipa Payload)

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: LiDARScanner-unsigned-ipa
          path: build/LiDARScanner-unsigned.ipa
          retention-days: 14

      # Public, login-free download link for the latest build:
      # https://github.com/<owner>/<repo>/releases/download/latest-build/LiDARScanner.ipa
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/LiDARScanner-unsigned.ipa build/LiDARScanner.ipa
          gh release delete latest-build --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest-build build/LiDARScanner.ipa --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" \
            --notes "Unsigned build of $GITHUB_SHA. Install with SideStore or Sideloadly (see Docs/INSTALL_WITHOUT_MAC.md)."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: "*.log"
          retention-days: 7
