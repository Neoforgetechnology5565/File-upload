# XcodeGen project specification.
#   brew install xcodegen
#   xcodegen generate
#   open LiDARScanner.xcodeproj
#
# The generated .xcodeproj is intentionally not committed (see .gitignore):
# this file is the single source of truth for targets, settings and schemes.
name: LiDARScanner

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # CONFIGURATION POINT: set your Apple Developer Team ID for device builds.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  ScanCore:
    path: Packages/ScanCore

targets:
  LiDARScanner:
    type: application
    platform: iOS
    sources:
      - path: LiDARScanner
    dependencies:
      - package: ScanCore
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: RoomPlan.framework
      - sdk: SceneKit.framework
      - sdk: ModelIO.framework
      - sdk: SwiftData.framework
      - sdk: Security.framework
    info:
      path: LiDARScanner/Resources/Info.plist
      properties:
        CFBundleDisplayName: LiDAR Scanner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: LiDAR Scanner uses the camera and LiDAR Scanner to capture rooms, objects and spaces in 3D. Scans stay on your device.
        # ARKit is required to install. LiDAR itself cannot be declared as a
        # required capability; it is checked at runtime with a clear message.
        UIRequiredDeviceCapabilities: [arkit]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleDefault
        ITSAppUsesNonExemptEncryption: false
        # CONFIGURATION POINT: HTTPS base URL of your auth backend
        # (e.g. https://api.example.com/v1). Empty = on-device accounts.
        LSBackendBaseURL: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lidarscanner
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO

  LiDARScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LiDARScannerTests
    dependencies:
      - target: LiDARScanner
      - package: ScanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lidarscanner.tests
        GENERATE_INFOPLIST_FILE: YES

  LiDARScannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LiDARScannerUITests
    dependencies:
      - target: LiDARScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lidarscanner.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LiDARScanner

schemes:
  LiDARScanner:
    build:
      targets:
        LiDARScanner: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LiDARScannerTests
        - LiDARScannerUITests
    archive:
      config: Release
